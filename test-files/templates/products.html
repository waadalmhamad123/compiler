<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Products</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1 th:text="${title}">Products</h1>
    <a th:href="@{/products/add}" class="btn">Add Product</a>

    <div class="grid">
        <div class="card" th:each="p : ${products}">
            <img th:src="@{${p.image}}" th:alt="${p.name}">
            <h2 th:text="${p.name}">Name</h2>
            <p class="price" th:text="${p.price}">0</p>
            <a th:href="@{/products/{id}(id=${p.id})}">Details</a>
        </div>
    </div>
</body>
</html>
